home-features-kicker = "選ばれる理由"
home-features-title = "ウェブ標準に基づく設計と、開発時間の短縮"
home-features-description = "標準的なHTMLとCSSを基盤に、最小限のJavaScriptで構築されています。"
home-feature-1-title = "デジタル庁デザインシステムに基づいたUI"
home-feature-1-description = "デジタル庁デザインシステムで定義されたUI設計を取り入れて見やすさとわかりやすさを提供。ただ取り入れただけでなく、実際の開発に使いやすいように実装を工夫しています。"
home-feature-2-title = "Sassファースト"
home-feature-2-description = "基本的なデザインスタイル設計はstylesフォルダ内のテンプレートファイルによって定義されています。拡張性と汎用性を確保した設計であらゆるカスタマイズが低コストで行えます。"
home-feature-3-title = "依存ゼロ設計"
home-feature-3-description = "特定のJavaScriptライブラリに依存しない設計。React、Vue、Svelteはもちろん、PHPやGoさらにRazorなどのテンプレートエンジンでも同じ構成で動作します。環境に縛られず、既存のスタックへそのまま統合できます。"

