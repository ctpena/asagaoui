{{ define "main" }}
    <h1 class="h1">{{ .Title }}</h1>
    <div class="content">
        {{ .Content }}
    </div>
    <h2 class="h2 mt-6 mb-4">{{ .Title }}{{ i18n "list" }}</h2>
    <ul class="grid g-4">
        {{ range .Pages }}
            <li class="col-12 col-sm-6">
                <article class="card">
                    <div class="card-body">
                        <h3 class="card-title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>
                    </div>
                </article>
            </li>
        {{ end }}
    </ul>
{{ end }}
